# render.yaml — Blueprint de Render
services:
  - type: web
    name: erp-django-utec
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    startCommand: gunicorn core.wsgi --workers 2 --timeout 120 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.8"          # Django 6.x exige Python >= 3.12 (3.11.9 ya no sirve)
      # Opcionales (si usas dominio propio):
      # - key: ALLOWED_HOSTS
      #   value: erp.midominio.com
      # - key: CSRF_TRUSTED_ORIGINS
      #   value: https://erp.midominio.com

databases:
  - name: erp-django-db
    databaseName: erp_db
    user: erp_user
    plan: free
    region: oregon
